# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "hmf"
repo_name: "cv-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 10

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
keywords:
  "Codec":                       # 传统／标准化编解码
    filters: [
      "codec", "video codec", "image codec",
      "entropy coding", "entropy model",
      "HEVC", "H.265", "VVC", "H.266", "AV1"
    ]

  "Learned Compression":         # 深度学习/神经压缩
    filters: [
      "learned image compression", "learned video compression",
      "neural image compression", "neural video compression",
      "deep image compression", "deep video compression",
      "end to end compression", "neural codec",
      "entropy model", "GAIN unit", "hyperprior"
    ]

  "Variable Bitrate":            # 可变码率 / 可伸缩
    filters: [
      "variable bitrate", "variable bit-rate", "variable rate",
      "continuous rate", "rate scalable", "scalable compression",
      "bitrate adaptation", "rate control", "scalable coding"
    ]

  "Large & Multimodal Models":   # SOTA 大模型 / 多模态
    filters: [
      "foundation model", "large vision model", "vision-language model",
      "multimodal", "multi-modal", "vision language", "VLM",
      "CLIP", "ImageBind", "EVA", "SAM", "Segment Anything",
      "ViT", "Vision Transformer", "Swin Transformer",
      "DINOv2", "LLAVA", "Video-LLaMA", "Video-LLM"
    ]

